<!-- MODAL UPLOAD FILE EXCEL IKM & IIPP DI sarpras.html -->
<div class="modal fade" id="modalUploadIkmExcel" tabindex="-1" aria-labelledby="modalUploadIkmExcelLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content rounded-4 border-0 shadow">
            <div class="modal-header bg-primary text-white rounded-top-4">
                <h5 class="modal-title fw-bold" id="modalUploadIkmExcelLabel">
                    <i class="bi bi-file-earmark-excel me-2"></i>Upload File Excel IKM & IIPP
                </h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body p-4">
                <div class="mb-3">
                    <label for="inputIkmExcelFile" class="form-label fw-semibold">Pilih File Excel (.xlsx / .xls)</label>
                    <input class="form-control" type="file" id="inputIkmExcelFile" accept=".xlsx, .xls">
                </div>
                <div class="alert alert-info small mb-0">
                    <i class="bi bi-info-circle-fill me-1"></i> Data dari file Excel akan disinkronkan ke Firebase Realtime Database dan otomatis memperbarui grafik 14 kategori pada dashboard <strong>ikm.html</strong>.
                </div>
            </div>
            <div class="modal-footer bg-light rounded-bottom-4">
                <button type="button" class="btn btn-secondary rounded-3 px-4" data-bs-dismiss="modal">Batal</button>
                <button type="button" class="btn btn-primary rounded-3 px-4 fw-bold" onclick="prosesUploadIkmExcel()">
                    <i class="bi bi-cloud-upload-fill me-1"></i> Upload & Simpan Ke Firebase
                </button>
            </div>
        </div>
    </div>
</div>

<!-- LIBRARY SHEETJS DIBUTUHKAN DI sarpras.html -->
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<script>
const bulanListFull = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];

function prosesUploadIkmExcel() {
    const fileInput = document.getElementById('inputIkmExcelFile');
    const file = fileInput ? fileInput.files[0] : null;

    if (!file) {
        alert("Silakan pilih file Excel terlebih dahulu!");
        return;
    }

    const reader = new FileReader();
    reader.onload = function (e) {
        try {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, { type: 'array' });
            const firstSheetName = workbook.SheetNames[0];
            const worksheet = workbook.Sheets[firstSheetName];
            const jsonData = XLSX.utils.sheet_to_json(worksheet, { defval: null });

            if (!jsonData || jsonData.length === 0) {
                alert("File Excel kosong atau format tidak sesuai!");
                return;
            }

            const monthsArray = Array.from({ length: 12 }, (_, i) => {
                const namaBulan = bulanListFull[i];
                const row = jsonData.find(r => {
                    const b = r["Bulan"] || r["BULAN"] || r["bulan"];
                    return b && String(b).trim().toLowerCase() === namaBulan.toLowerCase();
                }) || {};

                const getNum = (keys) => {
                    for (let k of keys) {
                        if (row[k] !== undefined && row[k] !== null && row[k] !== "") {
                            const val = parseFloat(row[k]);
                            return isNaN(val) ? null : val;
                        }
                    }
                    return null;
                };

                const ikmSkor = getNum(["IKM Skor", "ikm_skor", "Skor IKM", "IKM"]);
                const iippSkor = getNum(["IIPP Skor", "iipp_skor", "Skor IIPP", "IIPP"]);

                const ikmPria = parseInt(getNum(["IKM Pria", "ikm_pria"])) || 0;
                const ikmWanita = parseInt(getNum(["IKM Wanita", "ikm_wanita"])) || 0;
                const iippPria = parseInt(getNum(["IIPP Pria", "iipp_pria"])) || 0;
                const iippWanita = parseInt(getNum(["IIPP Wanita", "iipp_wanita"])) || 0;

                const kategoriDetail = {
                    iipp_diskriminasi: getNum(["IIPP Diskriminasi", "iipp_diskriminasi", "Diskriminasi Pelayanan"]),
                    iipp_luar_prosedur: getNum(["IIPP Luar Prosedur", "iipp_luar_prosedur", "Pelayanan Di Luar Prosedur"]),
                    iipp_imbalan: getNum(["IIPP Imbalan", "iipp_imbalan", "Penerimaan Imbalan"]),
                    iipp_percaloan: getNum(["IIPP Percaloan", "iipp_percaloan", "Percaloan"]),
                    iipp_pungli: getNum(["IIPP Pungli", "iipp_pungli", "Pungutan Liar"]),

                    ikm_biaya: getNum(["IKM Biaya", "ikm_biaya", "Biaya/Tarif"]),
                    ikm_kompetensi: getNum(["IKM Kompetensi", "ikm_kompetensi", "Kompetensi Pelaksana"]),
                    ikm_pengaduan: getNum(["IKM Pengaduan", "ikm_pengaduan", "Penanganan Pengaduan"]),
                    ikm_perilaku: getNum(["IKM Perilaku", "ikm_perilaku", "Perilaku Pelaksana"]),
                    ikm_persyaratan: getNum(["IKM Persyaratan", "ikm_persyaratan", "Persyaratan"]),
                    ikm_produk: getNum(["IKM Produk", "ikm_produk", "Produk Sertifikasi"]),
                    ikm_sarpras: getNum(["IKM Sarpras", "ikm_sarpras", "Sarana dan Prasarana"]),
                    ikm_prosedur: getNum(["IKM Prosedur", "ikm_prosedur", "Sistem, Mekanisme, dan Prosedur"]),
                    ikm_waktu: getNum(["IKM Waktu", "ikm_waktu", "Waktu Penyelesaian"])
                };

                return {
                    id: i + 1,
                    bulan: namaBulan,
                    ikm_skor: ikmSkor,
                    ikm_pria: ikmPria,
                    ikm_wanita: ikmWanita,
                    iipp_skor: iippSkor,
                    iipp_pria: iippPria,
                    iipp_wanita: iippWanita,
                    kategori_detail: kategoriDetail
                };
            });

            const tahunTarget = typeof currentSelectedYear !== 'undefined' ? currentSelectedYear : 2026;
            const pathNode = (String(tahunTarget) === '2026') 
                ? 'kinerja_sarpras/ikm_iipp_detail' 
                : `kinerja_sarpras_by_year/${tahunTarget}/ikm_iipp_detail`;

            database.ref(pathNode).set({
                months: monthsArray,
                updatedAt: new Date().toISOString()
            }).then(() => {
                alert("Data IKM & IIPP berhasil diunggah dari Excel dan disinkronkan ke Firebase!");
                const modalEl = bootstrap.Modal.getInstance(document.getElementById('modalUploadIkmExcel'));
                if (modalEl) modalEl.hide();
                fileInput.value = "";
            }).catch((err) => {
                alert("Gagal menyimpan ke Firebase: " + err.message);
            });

        } catch (error) {
            alert("Terjadi kesalahan saat memproses file Excel: " + error.message);
        }
    };

    reader.readAsArrayBuffer(file);
}
</script>
