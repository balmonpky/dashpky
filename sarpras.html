<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MENU SARPRAS & LAYANAN - BALMON PALANGKARAYA</title>
    
    <!-- Ikon Tab Browser -->
    <link rel="icon" type="image/png" href="Logo Balmon Palangkaraya fix.png">
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Google Font Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-blue: #0f4c81;
            --accent-blue: #1b75bc;
            --card-shadow: 0 15px 35px rgba(0, 0, 0, 0.08), 0 5px 15px rgba(0, 0, 0, 0.04);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            background-image: 
                radial-gradient(at 100% 0%, rgba(224, 242, 254, 0.8) 0, transparent 40%), 
                radial-gradient(at 0% 100%, rgba(186, 230, 253, 0.6) 0, transparent 40%);
            background-attachment: fixed;
            color: #334155;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* HEADER / NAVBAR */
        .navbar-custom {
            background: linear-gradient(135deg, #0f4c81 0%, #1e3a8a 100%);
            padding: 1rem 2rem;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
        }
        
        .logo-container {
            width: 50px;
            height: 50px;
            background: #fff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .logo-container img {
            width: 38px;
            height: 38px;
            object-fit: contain;
        }

        /* AREA KONTEN TENGAH */
        .main-container {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 3rem 0;
        }

        .header-title {
            text-align: center;
            margin-bottom: 3rem;
        }
        .header-title h2 {
            font-weight: 800;
            color: var(--primary-blue);
            letter-spacing: -0.5px;
            margin-bottom: 0.5rem;
        }
        .header-title p {
            font-size: 1.1rem;
            color: #64748b;
        }

        /* DESAIN KARTU SUB-MENU */
        .sub-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(226, 232, 240, 0.8);
            border-radius: 16px;
            padding: 2rem 1.5rem;
            text-align: center;
            text-decoration: none;
            color: inherit;
            display: block;
            height: 100%;
            box-shadow: var(--card-shadow);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .sub-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px -10px rgba(15, 76, 129, 0.15);
            background: #ffffff;
            border-color: #bae6fd;
        }

        .icon-wrapper {
            width: 70px;
            height: 70px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            margin: 0 auto 1.25rem auto;
            transition: transform 0.3s;
        }
        .sub-card:hover .icon-wrapper {
            transform: scale(1.1) rotate(5deg);
        }

        .card-smfr .icon-wrapper { background: #eff6ff; color: #3b82f6; }
        .card-unar .icon-wrapper { background: #f0fdf4; color: #22c55e; }
        .card-mots .icon-wrapper { background: #fffbeb; color: #f59e0b; }
        .card-bhp .icon-wrapper { background: #fef2f2; color: #ef4444; }
        .card-izin .icon-wrapper { background: #faf5ff; color: #a855f7; }
        .card-anggaran .icon-wrapper { background: #ecfdf5; color: #059669; }
        .card-monitoring .icon-wrapper { background: #e0f2fe; color: #0284c7; }

        .sub-card h5 {
            font-weight: 700;
            font-size: 1.15rem;
            margin-bottom: 0.5rem;
            color: #1e293b;
        }
        .sub-card p {
            font-size: 0.85rem;
            color: #64748b;
            margin-bottom: 0;
            line-height: 1.5;
        }

        /* HEADER KINERJA */
        .header-kinerja {
            background: linear-gradient(135deg, #0f4c81 0%, #1e3a8a 100%);
            color: white;
            border-radius: 24px;
            padding: 2rem 2.5rem;
            margin-bottom: 2.5rem;
            display: flex;
            align-items: center;
            gap: 25px;
            box-shadow: 0 15px 35px rgba(15, 76, 129, 0.2);
            position: relative;
            overflow: hidden;
        }
        .header-kinerja::after {
            content: ''; position: absolute; top: -50%; right: -5%;
            width: 300px; height: 300px;
            background: radial-gradient(circle, rgba(255,255,255,0.15) 0%, rgba(255,255,255,0) 70%);
            border-radius: 50%;
        }
        .header-icon-box {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
            padding: 1rem;
            border-radius: 20px;
        }

        /* KARTU DASBOR */
        .kinerja-card {
            background: #ffffff;
            border-radius: 20px;
            padding: 1.8rem;
            border: 1px solid #f1f5f9;
            box-shadow: 0 10px 30px rgba(0,0,0,0.03);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            height: 100%;
            position: relative;
            overflow: hidden;
        }
        .kinerja-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.08);
            border-color: #e2e8f0;
        }

        .accent-1 { border-top: 5px solid #3b82f6; }
        .accent-2 { border-top: 5px solid #6366f1; }
        .accent-3 { border-top: 5px solid #10b981; }
        .accent-4 { border-top: 5px solid #8b5cf6; }
        .accent-5 { border-top: 5px solid #f59e0b; }
        .accent-6 { border-top: 5px solid #0ea5e9; }

        .kinerja-icon {
            width: 55px; height: 55px;
            border-radius: 16px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.6rem;
            color: white;
            box-shadow: 0 8px 15px rgba(0,0,0,0.1);
        }
        .bg-icon-1 { background: linear-gradient(135deg, #60a5fa 0%, #2563eb 100%); }
        .bg-icon-2 { background: linear-gradient(135deg, #818cf8 0%, #4f46e5 100%); }
        .bg-icon-3 { background: linear-gradient(135deg, #34d399 0%, #059669 100%); }
        .bg-icon-4 { background: linear-gradient(135deg, #a78bfa 0%, #7c3aed 100%); }
        .bg-icon-5 { background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%); }
        .bg-icon-6 { background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%); }

        .kinerja-title {
            font-size: 0.85rem; font-weight: 700; color: #475569;
            text-transform: uppercase; letter-spacing: 0.5px;
            line-height: 1.4;
        }
        .capaian-value {
            font-size: 2.8rem; font-weight: 800;
            letter-spacing: -1px;
        }

        .progress-label {
            font-size: 0.75rem; font-weight: 700; color: #64748b;
            text-transform: uppercase; margin-bottom: 4px;
        }
        .progress {
            height: 12px;
            border-radius: 10px;
            background-color: #f1f5f9;
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.05);
            margin-bottom: 1rem;
        }
